# Tiered routing (§3, §5.4). Point these at any OpenAI-compatible endpoint.
model_list:
  - model_name: frontier
    litellm_params:
      model: anthropic/claude-fable-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: standard
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: mini
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  num_retries: 2
  fallbacks:
    - frontier: ["standard"]
    - standard: ["mini"]
